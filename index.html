<body>

<div class="app">

    <div class="header">

        <h1>
            SIEGE OF ORISON
            <span style="color:#4cc9ff;">—</span>
            DAY / NIGHT CYCLE
        </h1>

        <div class="subtitle">
            24h Earth Clock — <span id="timezone">LOCAL TIME</span> — Real Time
        </div>

    </div>


    <div class="clock">

        <canvas id="clock"></canvas>

        <div class="center">

            <div id="date" class="date">
                --/--/----
            </div>

            <div id="now" class="now">
                --:--:--
            </div>

            <div id="period" class="period">
                ---
            </div>

            <div id="remaining" class="remaining">
                ---
            </div>

        </div>

    </div>


    <div class="info">

        <span>
            ☀ DAY:
            <b id="dayDuration">03:05:52</b>
        </span>

        <span>
            ☾ NIGHT:
            <b id="nightDuration">02:00:07</b>
        </span>

        <span>
            ↻ CYCLE:
            <b id="cycleDuration">05:06:00</b>
        </span>

    </div>
</div>
